jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Run project CI
        run: pnpm run ci
    timeout-minutes: 20
name: pnpm CI
on:
  workflow_call:
permissions:
  contents: read
