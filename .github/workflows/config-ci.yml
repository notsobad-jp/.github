jobs:
  check:
    defaults:
      run:
        working-directory: packages/config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/config/package.json
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: packages/config/pnpm-lock.yaml
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
    timeout-minutes: 10
name: Config CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
